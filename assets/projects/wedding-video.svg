<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Viewfinder kamera saat pengambilan gambar wedding">
  <defs>
    <linearGradient id="vfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1830"/><stop offset="1" stop-color="#05090F"/>
    </linearGradient>
    <radialGradient id="vfGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#3B6CF6" stop-opacity=".45"/><stop offset="1" stop-color="#3B6CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#vfBg)"/>
  <rect width="800" height="500" fill="url(#vfGlow)"/>

  <!-- couple silhouette -->
  <g>
    <ellipse cx="430" cy="472" rx="210" ry="58" fill="#3B6CF6" opacity=".16"/>
    <!-- groom -->
    <path d="M300 500c0-86 24-130 62-130s62 44 62 130Z" fill="#101D33"/>
    <circle cx="362" cy="336" r="27" fill="#16273F"/>
    <path d="M335 330c2-22 14-32 27-32s25 10 27 32c-9-9-17-13-27-13s-18 4-27 13Z" fill="#0B1526" opacity=".85"/>
    <!-- bride -->
    <path d="M420 500c0-80 22-122 58-122s58 42 58 122Z" fill="#1A2B47"/>
    <circle cx="478" cy="342" r="25" fill="#22375A"/>
    <path d="M450 340c-4-30 12-48 28-48s32 18 28 48c-6-26-14-38-28-38s-22 12-28 38Z" fill="#E4EEFF" opacity=".24"/>
    <!-- rim light -->
    <path d="M304 500c0-84 24-128 58-128" stroke="#7CE8FF" stroke-width="2" fill="none" opacity=".22"/>
    <path d="M424 500c0-78 22-120 54-120" stroke="#7CE8FF" stroke-width="2" fill="none" opacity=".4"/>
  </g>

  <!-- viewfinder corners -->
  <g stroke="#7CE8FF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 110V60h50M690 60h50v50M740 390v50h-50M110 440H60v-50"/>
  </g>

  <!-- thirds grid -->
  <g stroke="#7CE8FF" stroke-width="1" opacity=".18">
    <path d="M307 60v380M493 60v380M60 187h680M60 313h680"/>
  </g>

  <!-- focus box -->
  <g stroke="#7CE8FF" stroke-width="2" fill="none">
    <rect x="392" y="272" width="120" height="120" rx="4" opacity=".85"/>
  </g>

  <!-- rec indicator -->
  <circle cx="96" cy="86" r="7" fill="#FF5D5D"/>
  <text x="114" y="91" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#EAEEF7" letter-spacing="1">REC</text>
  <text x="600" y="91" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8FA0BE">4K · 24fps</text>

  <!-- bottom info -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8FA0BE">
    <text x="62" y="420">ISO 800</text>
    <text x="62" y="438">1/50 · f/2.0</text>
    <text x="646" y="420">00:12:04</text>
  </g>
  <!-- audio meters -->
  <g fill="#7CE8FF" opacity=".8">
    <rect x="660" y="330" width="5" height="70" rx="2"/>
    <rect x="670" y="344" width="5" height="56" rx="2"/>
  </g>
</svg>
