<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Timeline editing video wedding">
  <defs>
    <linearGradient id="edBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080E1C"/><stop offset="1" stop-color="#111F3C"/>
    </linearGradient>
    <linearGradient id="edPreview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22406F"/><stop offset="1" stop-color="#0D1A33"/>
    </linearGradient>
    <linearGradient id="edWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B6CF6"/><stop offset="1" stop-color="#7CE8FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#edBg)"/>

  <!-- preview window -->
  <rect x="40" y="40" width="720" height="250" rx="14" fill="url(#edPreview)" stroke="#22355C"/>
  <!-- scene silhouette -->
  <g opacity=".55">
    <circle cx="300" cy="150" r="26" fill="#7CE8FF" opacity=".35"/>
    <path d="M258 250c4-42 18-64 42-64s38 22 42 64Z" fill="#7CE8FF" opacity=".22"/>
    <circle cx="470" cy="160" r="22" fill="#EAEEF7" opacity=".22"/>
    <path d="M434 250c3-36 15-56 36-56s33 20 36 56Z" fill="#EAEEF7" opacity=".16"/>
  </g>
  <rect x="40" y="40" width="720" height="250" rx="14" fill="none" stroke="#2C4470"/>
  <!-- play button -->
  <circle cx="400" cy="165" r="34" fill="#060A14" opacity=".55"/>
  <circle cx="400" cy="165" r="34" fill="none" stroke="#7CE8FF" stroke-width="2"/>
  <path d="M392 149l26 16-26 16Z" fill="#7CE8FF"/>

  <!-- timeline ruler -->
  <g stroke="#2A3D63" stroke-width="1">
    <path d="M40 330h720M40 330v8M90 330v5M140 330v5M190 330v8M240 330v5M290 330v5M340 330v8M390 330v5M440 330v5M490 330v8M540 330v5M590 330v5M640 330v8M690 330v5M740 330v5"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5E6E8C">
    <text x="36" y="356">00:00</text><text x="184" y="356">00:05</text><text x="334" y="356">00:10</text><text x="484" y="356">00:15</text><text x="634" y="356">00:20</text>
  </g>

  <!-- video track -->
  <g>
    <rect x="40" y="372" width="230" height="34" rx="6" fill="#1E3563"/>
    <rect x="278" y="372" width="300" height="34" rx="6" fill="#2A4C8F"/>
    <rect x="586" y="372" width="174" height="34" rx="6" fill="#1E3563"/>
    <g fill="#7CE8FF" opacity=".5">
      <rect x="48" y="380" width="26" height="18" rx="2"/><rect x="82" y="380" width="26" height="18" rx="2"/>
      <rect x="286" y="380" width="26" height="18" rx="2"/><rect x="320" y="380" width="26" height="18" rx="2"/><rect x="354" y="380" width="26" height="18" rx="2"/>
      <rect x="594" y="380" width="26" height="18" rx="2"/>
    </g>
  </g>

  <!-- audio waveform -->
  <g fill="url(#edWave)" opacity=".85">
    <rect x="40" y="420" width="4" height="10" rx="2"/><rect x="48" y="416" width="4" height="18" rx="2"/>
    <rect x="56" y="412" width="4" height="26" rx="2"/><rect x="64" y="418" width="4" height="14" rx="2"/>
    <rect x="72" y="408" width="4" height="34" rx="2"/><rect x="80" y="414" width="4" height="22" rx="2"/>
    <rect x="88" y="410" width="4" height="30" rx="2"/><rect x="96" y="420" width="4" height="10" rx="2"/>
    <rect x="104" y="412" width="4" height="26" rx="2"/><rect x="112" y="416" width="4" height="18" rx="2"/>
    <rect x="120" y="408" width="4" height="34" rx="2"/><rect x="128" y="418" width="4" height="14" rx="2"/>
    <rect x="136" y="412" width="4" height="26" rx="2"/><rect x="144" y="416" width="4" height="18" rx="2"/>
    <rect x="152" y="410" width="4" height="30" rx="2"/><rect x="160" y="420" width="4" height="10" rx="2"/>
    <rect x="168" y="414" width="4" height="22" rx="2"/><rect x="176" y="408" width="4" height="34" rx="2"/>
    <rect x="184" y="418" width="4" height="14" rx="2"/><rect x="192" y="412" width="4" height="26" rx="2"/>
    <rect x="200" y="416" width="4" height="18" rx="2"/><rect x="208" y="410" width="4" height="30" rx="2"/>
    <rect x="216" y="420" width="4" height="10" rx="2"/><rect x="224" y="414" width="4" height="22" rx="2"/>
    <rect x="232" y="412" width="4" height="26" rx="2"/><rect x="240" y="418" width="4" height="14" rx="2"/>
    <rect x="248" y="408" width="4" height="34" rx="2"/><rect x="256" y="416" width="4" height="18" rx="2"/>
    <rect x="264" y="412" width="4" height="26" rx="2"/>
  </g>

  <!-- playhead -->
  <path d="M330 320v128" stroke="#7CE8FF" stroke-width="1.6" opacity=".9"/>
  <path d="M324 314h12l-6 8Z" fill="#7CE8FF"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8FA0BE">
    <text x="40" y="486">V1 · wedding_final.mp4</text>
    <text x="600" y="486">A1 · music.wav</text>
  </g>
</svg>
